name: Base Daily Builds

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Stop after 30-day window
        run: |
          END_DATE="2026-09-01"
          TODAY=$(date -u +%Y-%m-%d)
          if [[ "$TODAY" > "$END_DATE" ]]; then
            echo "30-day window is over. Skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "SKIP=false" >> "$GITHUB_ENV"
          fi

      - name: Random delay
        if: github.event_name == 'schedule' && env.SKIP == 'false'
        run: |
          DELAY=$(( RANDOM % 5400 ))
          echo "Sleeping for $DELAY seconds"
          sleep "$DELAY"

      - name: Configure git
        if: env.SKIP == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Advance the toolkit by one real step
        if: env.SKIP == 'false'
        run: |
          mkdir -p snippets queue

          # Helper: get description for a given NN-name.js filename
          get_desc () {
            local file="$1"
            local num
            num=$(basename "$file" | sed -E 's/^0*([0-9]+)-.*/\1/')
            sed -n "${num}p" .github/snippet-descriptions.txt | cut -d'|' -f2
          }

          # Step 1: any snippet already added but not yet documented in README?
          UNDOCUMENTED=""
          for f in snippets/*.js; do
            [ -e "$f" ] || continue
            base_f=$(basename "$f")
            if ! grep -qF "snippets/$base_f" README.md; then
              UNDOCUMENTED="$f"
              break
            fi
          done

          if [ -n "$UNDOCUMENTED" ]; then
            NAME=$(basename "$UNDOCUMENTED" .js | sed -E 's/^[0-9]+-//')
            DESC=$(get_desc "$UNDOCUMENTED")
            echo "- \`snippets/$(basename "$UNDOCUMENTED")\` — $DESC" >> README.md
            git add README.md
            git commit -m "docs: index $NAME snippet in README"
            git push
            exit 0
          fi

          # Step 2: otherwise, move the next queued snippet (alphabetically first) into snippets/
          NEXT=$(find queue -maxdepth 1 -type f -name '*.js' 2>/dev/null | sort | head -n 1)
          if [ -z "$NEXT" ]; then
            echo "Nothing left in the queue. Toolkit is complete."
            exit 0
          fi

          FILE=$(basename "$NEXT")
          NAME=$(basename "$FILE" .js | sed -E 's/^[0-9]+-//')
          git mv "$NEXT" "snippets/$FILE"
          git commit -m "Add $NAME snippet"
          git push
